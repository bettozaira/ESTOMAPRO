<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESTOMAPRO - Tecnologia em Estomaterapia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Paleta Estrita Definida
              brand: {
                vivid: '#23D962',   // Destaques, Ícones, Gradientes de luz
                mid: '#21BF48',     // Hover, Elementos secundários
                dark: '#2E5939',    // Institucional, Botões, Títulos Fortes
                black: '#0D0A0A',   // Hero BG, Footer, Textos Principais
                surface: '#F2F2F2', // Fundo Geral
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            animation: {
              'fade-up': 'fadeUp 0.8s ease-out forwards',
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(46, 89, 57, 0.1)',
              'glow': '0 0 20px rgba(35, 217, 98, 0.3)',
              'soft': '0 10px 40px -10px rgba(13, 10, 10, 0.05)',
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #F2F2F2;
        color: #0D0A0A;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F2F2F2;
      }
      ::-webkit-scrollbar-thumb {
        background: #2E5939;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #21BF48;
      }
      
      .glass-panel {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
  }
}
</script>
</head>
  <body class="bg-brand-surface text-brand-black selection:bg-brand-vivid selection:text-brand-black">
    <div id="root"></div>
  </body>
</html>
